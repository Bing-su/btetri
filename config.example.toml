# Omitted settings keep their defaults; copy this file to the --config path.
player = "PLAYER"
mode = "marathon"
start_level = 1
max_level = 20
end_on_max_level = false
ghost_enabled = true
next_queue_length = 6

[keys]
left = ["left"]
right = ["right"]
clockwise = ["up", "x"]
counter_clockwise = ["z", "ctrl"]
rotate_180 = ["a"]
hard_drop = ["space"]
soft_drop = ["down"]
hold = ["c", "shift"]
pause = ["esc"]
help = ["?"]

# Flat colors match the selected terminal designs; e.g. #64C4EB is cyan.
[theme]
background = "#101116"
foreground = "#E9E9ED"
muted = "#A7ABB5"
border = "#888C96"
accent = "#64C4EB"
grid = "#2A2D35"
ghost = "#8C7189"
i = "#64C4EB"
o = "#F1D448"
t = "#A15398"
s = "#64B452"
z = "#DC3A35"
j = "#5C65A8"
l = "#E07F3A"
